<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">public-ready 对 HENU Kit 的真实审计结果节选</title>
  <desc id="desc">真实扫描共发现 66 条问题，其中 12 条为上线阻塞项。画面展示四条代表性发现及修改建议。</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#171C22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="980" rx="28" fill="#0B0D10"/>
  <rect width="1200" height="980" rx="28" fill="url(#grid)"/>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="44" y="40" width="1112" height="132" rx="22" fill="#12171D" stroke="#303843" stroke-width="2"/>
    <text x="72" y="78" fill="#5AD8A6" font-size="20" font-weight="700" letter-spacing="1.5">REAL RUN · HENU KIT</text>
    <text x="72" y="126" fill="#F4F6F8" font-size="40" font-weight="760">上线前文案对账扫描</text>
    <text x="880" y="105" fill="#F4F6F8" font-size="52" font-weight="780">66</text>
    <text x="960" y="105" fill="#9BA6B3" font-size="22">条发现</text>

    <g transform="translate(64 198)">
      <g>
        <rect width="244" height="60" rx="17" fill="#171D24" stroke="#303843"/>
        <text x="22" y="39" fill="#FF6B6B" font-size="28" font-weight="780">12</text>
        <text x="72" y="38" fill="#F4F6F8" font-size="20">上线阻塞</text>
      </g>
      <g transform="translate(258 0)">
        <rect width="244" height="60" rx="17" fill="#171D24" stroke="#303843"/>
        <text x="22" y="39" fill="#FFAA4C" font-size="28" font-weight="780">28</text>
        <text x="72" y="38" fill="#F4F6F8" font-size="20">上线前应改</text>
      </g>
      <g transform="translate(516 0)">
        <rect width="244" height="60" rx="17" fill="#171D24" stroke="#303843"/>
        <text x="22" y="39" fill="#FFD166" font-size="28" font-weight="780">18</text>
        <text x="72" y="38" fill="#F4F6F8" font-size="20">建议改</text>
      </g>
      <g transform="translate(774 0)">
        <rect width="244" height="60" rx="17" fill="#171D24" stroke="#303843"/>
        <text x="22" y="39" fill="#C2CAD4" font-size="28" font-weight="780">8</text>
        <text x="72" y="38" fill="#F4F6F8" font-size="20">可分批</text>
      </g>
    </g>

    <text x="64" y="306" fill="#F4F6F8" font-size="24" font-weight="720">代表性发现 · 节选自真实运行输出</text>
    <text x="64" y="340" fill="#9BA6B3" font-size="18">保留原始文件位置、问题判断与可执行修改建议。</text>

    <g transform="translate(56 374)">
      <rect width="1088" height="130" rx="20" fill="#12171D" stroke="#303843" stroke-width="2"/>
      <rect x="24" y="22" width="74" height="36" rx="10" fill="#FF6B6B"/>
      <text x="61" y="47" text-anchor="middle" fill="#0B0D10" font-size="18" font-weight="800">A+C</text>
      <text x="116" y="47" fill="#F4F6F8" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">apps/portal/src/lib/campus/mock.ts:106-125</text>
      <text x="24" y="82" fill="#9BA6B3" font-size="17">问题</text>
      <text x="86" y="82" fill="#F4F6F8" font-size="17">代做作业、代打卡示例经 SSG 进入生产详情页，存在定位冲突与合规风险。</text>
      <text x="24" y="112" fill="#9BA6B3" font-size="17">建议</text>
      <text x="86" y="112" fill="#5AD8A6" font-size="17">替换为合规示例；接入真实数据前删除，或明确标注为示例。</text>
    </g>

    <g transform="translate(56 522)">
      <rect width="1088" height="130" rx="20" fill="#12171D" stroke="#303843" stroke-width="2"/>
      <rect x="24" y="22" width="74" height="36" rx="10" fill="#FFAA4C"/>
      <text x="61" y="47" text-anchor="middle" fill="#0B0D10" font-size="18" font-weight="800">A+B</text>
      <text x="116" y="47" fill="#F4F6F8" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">apps/portal/src/components/data-state.tsx:41</text>
      <text x="24" y="82" fill="#9BA6B3" font-size="17">问题</text>
      <text x="86" y="82" fill="#F4F6F8" font-size="17">环境变量、服务名与 mock 机制直接暴露给学生，且没有下一步操作。</text>
      <text x="24" y="112" fill="#9BA6B3" font-size="17">建议</text>
      <text x="86" y="112" fill="#5AD8A6" font-size="17">页面改为“服务暂时不可用，请稍后再来”，内部原因只写日志。</text>
    </g>

    <g transform="translate(56 670)">
      <rect width="1088" height="130" rx="20" fill="#12171D" stroke="#303843" stroke-width="2"/>
      <rect x="24" y="22" width="74" height="36" rx="10" fill="#FFD166"/>
      <text x="61" y="47" text-anchor="middle" fill="#0B0D10" font-size="18" font-weight="800">C</text>
      <text x="116" y="47" fill="#F4F6F8" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">apps/portal/src/app/layout.tsx:29-40</text>
      <text x="24" y="82" fill="#9BA6B3" font-size="17">问题</text>
      <text x="86" y="82" fill="#F4F6F8" font-size="17">公开产品缺少“非官方项目”声明，与既定产品规则不一致。</text>
      <text x="24" y="112" fill="#9BA6B3" font-size="17">建议</text>
      <text x="86" y="112" fill="#5AD8A6" font-size="17">页脚与登录页固定展示“学生自主运营 · 非河南大学官方项目”。</text>
    </g>

    <g transform="translate(56 818)">
      <rect width="1088" height="104" rx="20" fill="#12171D" stroke="#303843" stroke-width="2"/>
      <rect x="24" y="22" width="74" height="36" rx="10" fill="#C2CAD4"/>
      <text x="61" y="47" text-anchor="middle" fill="#0B0D10" font-size="18" font-weight="800">D</text>
      <text x="116" y="47" fill="#F4F6F8" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">apps/portal/src/app/food/publish/page.tsx:3-4</text>
      <text x="24" y="82" fill="#9BA6B3" font-size="17">发现</text>
      <text x="86" y="82" fill="#F4F6F8" font-size="17">第三方投稿地址被硬编码；建议配置化并迁移到稳定的自有域名。</text>
    </g>

    <text x="64" y="954" fill="#6F7A87" font-size="15">真实运行输出 · 已重新排版以适配 GitHub README 阅读宽度</text>
    <text x="1136" y="954" text-anchor="end" fill="#6F7A87" font-size="15">public-ready</text>
  </g>
</svg>
