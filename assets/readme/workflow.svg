<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">public-ready 工作流程</title>
  <desc id="wfDesc">六个阶段依次进行：探索项目、建立画像、拆分扫描、四类核对、汇总对账表，最后一步「确认后修改」用虚线标出，表示默认不执行，需用户确认。</desc>

  <rect width="1200" height="300" rx="24" fill="#0B0D10"/>

  <text x="57" y="54" fill="#8D98A6" font-size="18" font-weight="700" letter-spacing="1.5"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">WORKFLOW</text>

  <g id="stage-1" transform="translate(57 100)">
    <rect width="156" height="92" rx="14" fill="#12161B" stroke="#2C333D"/>
    <text x="16" y="30" fill="#5A6472" font-size="17" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
    <text x="78" y="66" text-anchor="middle" fill="#E7EAF0" font-size="21" font-weight="650"
          font-family="'PingFang SC', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">探索项目</text>
  </g>
  <path d="M 223 139 L 233 146 L 223 153" fill="none" stroke="#4A5462" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="stage-2" transform="translate(243 100)">
    <rect width="156" height="92" rx="14" fill="#12161B" stroke="#2C333D"/>
    <text x="16" y="30" fill="#5A6472" font-size="17" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
    <text x="78" y="66" text-anchor="middle" fill="#E7EAF0" font-size="21" font-weight="650"
          font-family="'PingFang SC', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">建立画像</text>
  </g>
  <path d="M 409 139 L 419 146 L 409 153" fill="none" stroke="#4A5462" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="stage-3" transform="translate(429 100)">
    <rect width="156" height="92" rx="14" fill="#12161B" stroke="#2C333D"/>
    <text x="16" y="30" fill="#5A6472" font-size="17" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text>
    <text x="78" y="66" text-anchor="middle" fill="#E7EAF0" font-size="21" font-weight="650"
          font-family="'PingFang SC', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">拆分扫描</text>
  </g>
  <path d="M 595 139 L 605 146 L 595 153" fill="none" stroke="#4A5462" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="stage-4" transform="translate(615 100)">
    <rect width="156" height="92" rx="14" fill="#12161B" stroke="#2C333D"/>
    <text x="16" y="30" fill="#5A6472" font-size="17" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04</text>
    <text x="78" y="66" text-anchor="middle" fill="#E7EAF0" font-size="21" font-weight="650"
          font-family="'PingFang SC', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">四类核对</text>
    <g transform="translate(30 78)">
      <circle cx="0" cy="0" r="5" fill="#FF6B6B"/>
      <circle cx="16" cy="0" r="5" fill="#FFAA4C"/>
      <circle cx="32" cy="0" r="5" fill="#FFD166"/>
      <circle cx="48" cy="0" r="5" fill="#BCC5D0"/>
    </g>
  </g>
  <path d="M 781 139 L 791 146 L 781 153" fill="none" stroke="#4A5462" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="stage-5" transform="translate(801 100)">
    <rect width="156" height="92" rx="14" fill="#161C23" stroke="#5AD8A6" stroke-width="1.5"/>
    <text x="16" y="30" fill="#5A6472" font-size="17" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">05</text>
    <text x="78" y="66" text-anchor="middle" fill="#F7F8FA" font-size="21" font-weight="700"
          font-family="'PingFang SC', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">汇总对账表</text>
  </g>
  <path d="M 967 139 L 977 146 L 967 153" fill="none" stroke="#3A4250" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/>

  <g id="stage-6" transform="translate(987 100)">
    <rect width="156" height="92" rx="14" fill="#0E1216" stroke="#3A4250" stroke-dasharray="6 5"/>
    <text x="16" y="30" fill="#4A5462" font-size="17" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">06</text>
    <text x="78" y="66" text-anchor="middle" fill="#8D98A6" font-size="21" font-weight="650"
          font-family="'PingFang SC', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">确认后修改</text>
  </g>

  <text x="879" y="230" text-anchor="middle" fill="#5AD8A6" font-size="18" font-weight="650"
        font-family="'PingFang SC', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">默认交付到这里</text>
  <text x="1065" y="230" text-anchor="middle" fill="#707B89" font-size="18"
        font-family="'PingFang SC', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">你点头才动手</text>

  <text x="57" y="258" fill="#707B89" font-size="18"
        font-family="'PingFang SC', 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">画像落盘到 .agents/public-ready-profile.md，后续扫描直接复用</text>
</svg>
